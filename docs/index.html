<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="logo.png"><title>Tesorería · Grupo Scout Prometeo</title>
<style>
:root{color-scheme:light;--bd:#6b0e05;--am:#e0c55a;--bg:#faf5ee;--mu:#7a6a5f;--lin:#eadfcf;--tx:#2a1f1a;--ver:#2e6b3f;--roj:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding-bottom:14px;border-bottom:5px solid var(--am);margin-bottom:22px}
header img{width:60px;height:60px}.tit{flex:1;min-width:220px}.tit h1{margin:0;font-size:28px;color:var(--bd)}
.tit small{letter-spacing:.08em;color:var(--mu);font-size:14px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input,button{font:inherit;border:1px solid var(--lin);border-radius:12px;padding:9px 13px;background:#fff;color:var(--tx)}
button{cursor:pointer}button.p{background:var(--bd);color:#fff;border-color:var(--bd);font-weight:600}
.card{background:#fff;border:1px solid var(--lin);border-radius:22px;padding:22px 26px;margin-bottom:18px}
.card h2{margin:0 0 14px;font-size:20px;color:var(--bd)} .card h3{color:var(--mu);margin:14px 0 4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--lin);border-top:4px solid var(--am);border-radius:22px;padding:16px 20px}
.kpi span{color:var(--mu);font-size:14px}.kpi b{display:block;font-size:30px;margin-top:4px}
.v{color:var(--ver)}.r{color:var(--roj)}.mu{color:var(--mu);font-size:14px}
body.ocultar .m{filter:blur(7px);user-select:none}
details{border-bottom:1px solid var(--lin)}summary{cursor:pointer;padding:9px 2px;display:flex;gap:10px;align-items:center}
.n{flex:1}.num{text-align:right;min-width:92px;font-variant-numeric:tabular-nums}
details details{margin-left:18px}.sub{display:flex;gap:10px;padding:7px 2px 7px 22px;border-top:1px dotted var(--lin);align-items:center}
.bar{height:8px;background:var(--lin);border-radius:4px;overflow:hidden;width:100px}.bar i{display:block;height:100%;background:var(--bd)}
.bar.over i{background:var(--roj)}.warn{color:#9a6a00;font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 9px;border-bottom:1px solid var(--lin);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600}td.d{text-align:right}
</style></head><body><main>
<header><img src="logo.png" alt="Logo Grupo Scout Prometeo">
<div class="tit"><h1>Grupo Scout Prometeo</h1><small>TESORERÍA</small></div>
<div class="ctl"><select id="ron" title="Ronda solar"></select><select id="sec" title="Sección"></select>
<button id="ocu">Ocultar importes</button></div></header>
<p class="warn" id="aviso"></p>
<div class="kpis" id="kpis"></div>
<section class="card"><h2>Evolución del saldo</h2><div id="graf"></div></section>
<section class="card"><h2>Presupuesto ejecutado</h2><p class="mu">Ejecutado · presupuesto · avance. Importes de mayor a menor.</p><div id="pres"></div></section>
<section class="card"><h2>Movimientos</h2><p><input id="q" placeholder="Buscar…" size="30"></p><div class="tw"><table id="tab"></table></div></section>
<p class="mu" id="meta"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const f=n=>n.toLocaleString("es-ES",{style:"currency",currency:"EUR"});
const eur=n=>`<span class="m">${f(n)}</span>`;
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fe=s=>s.split("-").reverse().join("/");
let D;
fetch("data.json").then(r=>r.json()).then(d=>{D=d;
 const rs=[...new Set([...d.movimientos.map(m=>m.ronda),...d.presupuesto.map(r=>r.ronda)].filter(Boolean))].sort().reverse();
 $("ron").innerHTML=rs.map(r=>`<option>${esc(r)}</option>`).join("");
 const ss=["Manada","Tropa","Unidad","Clan","Kraal","Grupo"].filter(s=>d.movimientos.some(m=>m.seccion==s));
 $("sec").innerHTML=["<option value=''>Todas las secciones</option>",...ss.map(s=>`<option>${s}</option>`)].join("");
 $("meta").textContent="Datos actualizados el "+d.actualizado;
 $("ron").onchange=$("sec").onchange=pinta;$("q").oninput=pinta;pinta();});
$("ocu").onclick=()=>{document.body.classList.toggle("ocultar");$("ocu").textContent=document.body.classList.contains("ocultar")?"Mostrar importes":"Ocultar importes"};
function grafico(a){
 if(!a.length)return"<p class='mu'>Sin datos</p>";
 const W=1000,H=300,L=90,R=20,T=20,B=44,t=a.map(m=>Date.parse(m.fecha)),y=a.map(m=>m.saldo);
 const t0=Math.min(...t),t1=Math.max(...t),y0=Math.min(...y),y1=Math.max(...y);
 const X=v=>L+(t1==t0?.5:(v-t0)/(t1-t0))*(W-L-R),Y=v=>T+(y1==y0?.5:1-(v-y0)/(y1-y0))*(H-T-B);
 const P=a.map((m,i)=>[X(t[i]),Y(m.saldo)]);
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><g fill="#7a6a5f" font-size="15"><text class="m" x="${L-8}" y="${Y(y1)+5}" text-anchor="end">${f(y1)}</text><text class="m" x="${L-8}" y="${Y(y0)+5}" text-anchor="end">${f(y0)}</text><text x="${L}" y="${H-12}">${fe(a[0].fecha)}</text><text x="${W-R}" y="${H-12}" text-anchor="end">${fe(a[a.length-1].fecha)}</text></g><polyline fill="none" stroke="#6b0e05" stroke-width="3" stroke-linejoin="round" points="${P.map(p=>p.join(",")).join(" ")}"/>${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#6b0e05"><title>${fe(a[i].fecha)} · ${f(a[i].saldo)}</title></circle>`).join("")}</svg>`}
function pinta(){
 $("aviso").textContent=D.movimientos.length?"":"No hay movimientos en data.json: comprueba que el Excel esté en la carpeta datos/ (no como plantilla.xlsx) y que la Action haya terminado en verde.";
 const ron=$("ron").value,sec=$("sec").value,q=$("q").value.toLowerCase();
 const R=D.movimientos.filter(m=>m.ronda==ron),ms=R.filter(m=>!sec||m.seccion==sec);
 const P=D.presupuesto.filter(r=>!r.ronda||r.ronda==ron);
 const ing=ms.filter(m=>m.tipo=="Ingreso").reduce((a,m)=>a+m.importe,0),gas=ms.filter(m=>m.tipo=="Gasto").reduce((a,m)=>a+m.importe,0);
 const ult=R[R.length-1];
 $("kpis").innerHTML=`<div class="kpi"><span>Dinero en cuenta${ult?" · a "+fe(ult.fecha):""}</span><b>${eur(ult?ult.saldo:0)}</b></div><div class="kpi"><span>Ingresos ${esc(ron)}</span><b class="v">${eur(ing)}</b></div><div class="kpi"><span>Gastos ${esc(ron)}</span><b class="r">${eur(gas)}</b></div><div class="kpi"><span>Movimientos ${esc(ron)}</span><b>${ms.length}</b></div>`;
 $("graf").innerHTML=grafico(R);
 const T={},add=(tp,a,p,s,k,v)=>{const y=(((T[tp]??={})[a]??={})[p]??={})[s||"—"]??={pres:0,real:0,cal:"",sin:false};y[k]+=v;return y};
 P.forEach(r=>{add(r.tipo,r.agrupacion,r.partida,r.subpartida,"pres",r.anual).cal=r.calendario});
 ms.forEach(m=>{const y=add(m.tipo,m.concepto,m.partida,m.subpartida,"real",m.importe);
  if(!P.some(r=>r.tipo==m.tipo&&r.agrupacion==m.concepto&&r.partida==m.partida&&(r.subpartida||"—")==(m.subpartida||"—")))y.sin=true});
 const sum=o=>Object.values(o).reduce((a,v)=>{const s=v.pres===undefined?sum(v):v;return{pres:a.pres+s.pres,real:a.real+s.real}},{pres:0,real:0});
 const fila=t=>{const pc=t.pres?t.real/t.pres*100:(t.real?100:0);
  return `<span class="num">${eur(t.real)}</span><span class="num">${eur(t.pres)}</span><span class="bar ${pc>100?"over":""}"><i style="width:${Math.min(pc,100)}%"></i></span><span class="num">${t.pres?pc.toFixed(0)+"%":"—"}</span>`};
 let h="";
 for(const tp of Object.keys(T)){h+=`<h3>${esc(tp)}s</h3>`;
  for(const [a,ps] of Object.entries(T[tp]).sort((x,y)=>sum(y[1]).real-sum(x[1]).real)){
   h+=`<details open><summary><b class="n">${esc(a)}</b>${fila(sum(ps))}</summary>`;
   for(const [p,ss] of Object.entries(ps).sort((x,y)=>sum(y[1]).real-sum(x[1]).real)){
    h+=`<details><summary><span class="n">${esc(p)}</span>${fila(sum(ss))}</summary>`;
    for(const [s,v] of Object.entries(ss).sort((x,y)=>y[1].real-x[1].real))
     h+=`<div class="sub"><span class="n">${esc(s)} ${v.cal?`<small class="mu">(${v.cal}${v.cal=="Mensual"?": "+f(v.pres/12)+"/mes":""})</small>`:""}${v.sin?' <span class="warn">⚠ sin presupuestar</span>':""}</span>${fila(v)}</div>`;
    h+="</details>"}
   h+="</details>"}}
 $("pres").innerHTML=h||"<p class='mu'>Sin presupuesto cargado para esta ronda.</p>";
 const rows=ms.filter(m=>!q||[m.concepto,m.partida,m.subpartida,m.seccion,m.origen,m.ndoc].join(" ").toLowerCase().includes(q)).reverse();
 $("tab").innerHTML=`<tr><th>Fecha</th><th>Concepto</th><th>Partida</th><th>Subpartida</th><th>Sección</th><th>Tipo</th><th class="d">Importe</th><th class="d">Saldo</th><th>Origen/destino</th><th>Nº doc.</th></tr>`+
  rows.map(m=>`<tr><td>${fe(m.fecha)}</td><td>${esc(m.concepto)}</td><td>${esc(m.partida)}</td><td>${esc(m.subpartida)}</td><td>${esc(m.seccion)}</td><td>${esc(m.tipo)}</td><td class="d">${eur(m.importe)}</td><td class="d">${eur(m.saldo)}</td><td>${esc(m.origen)}</td><td>${esc(m.ndoc)}</td></tr>`).join("");
}
</script></body></html>
